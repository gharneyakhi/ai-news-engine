name: News Engine

on:
  workflow_dispatch:
  schedule:
    - cron: "0 5 * * *"

permissions:
  contents: write

jobs:
  fetch-news:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Test Gemini connection
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python gemini_test.py

      - name: Generate Persian articles
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python article_generator.py

      - name: Show generated articles
        run: |
          echo "Generated articles:"
          if [ -d "articles" ]; then
            find articles -type f -maxdepth 1 -print
          else
            echo "No articles directory found."
          fi

      - name: Commit generated articles
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add articles/

          if git diff --cached --quiet; then
            echo "No new articles to commit."
          else
            git commit -m "Generate Persian news articles"
            git push
          fi
