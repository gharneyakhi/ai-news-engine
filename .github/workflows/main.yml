name: News Engine

on:
  workflow_dispatch:
  schedule:
    - cron: "0 5 * * *"

jobs:
  fetch-news:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
- name: Check repository files
  run: |
    echo "Current directory:"
    pwd
    echo "Repository files:"
    ls -la
    echo "Git status:"
    git status
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run news fetcher
        run: python news_fetcher.py

      - name: Generate Persian articles
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python article_generator.py

      - name: Upload generated articles
        uses: actions/upload-artifact@v4
        with:
          name: generated-articles
          path: articles/
